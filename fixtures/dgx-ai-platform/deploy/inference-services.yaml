# Eight inference services. Each requests one whole GPU: Kubernetes extended resources are integers,
# so a pod that asks for nvidia.com/gpu: 1 is given an entire A100 even when it uses a small part of it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-assistant
  namespace: ai-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-assistant
  template:
    metadata:
      labels:
        app: chat-assistant
    spec:
      nodeSelector:
        kubernetes.io/hostname: dgx-01
      containers:
        - name: server
          image: registry.lab.internal/llm-chat:3.2
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: 64Gi
---
