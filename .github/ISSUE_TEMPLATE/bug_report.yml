name: Bug report
description: Brody did something the documentation says it should not
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Do not paste API keys, GitHub tokens, or secrets from a repository you analyzed. If this is a security vulnerability, close this form and use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: How you ran Brody
      options:
        - Local (npm run dev or npm start)
        - Docker Compose
        - Command line (npm run analyze)
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: The git commit, or "main", if you know it.
      placeholder: main
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system and `node -v`. Say whether an AI provider was configured, without pasting the key.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Anything that shows the failure. Remove tokens and repository secrets first.
